 const CATS=['Protein','Vegetables','Fruit','Grains','Dairy','Legumes','Nuts & seeds','Sri Lankan','My foods'];
 $('bx').onclick=()=>{const d={v:1,profiles:P,log:LOG,foods:CF,plan:PLAN,fav:FAV,chk:GROCHK},u=URL.createObjectURL(new Blob([JSON.stringify(d)],{type:'application/json'})),a=document.createElement('a');a.href=u;a.download='meal-calculator-backup.json';a.click();setTimeout(()=>URL.revokeObjectURL(u),1000)};
 $('bi').onchange=e=>{const f=e.target.files[0];if(!f)return;const rd=new FileReader();rd.onload=()=>{try{const d=JSON.parse(rd.result);if(!Array.isArray(d.profiles))throw 0;if(!confirm('Replace the data on this device with this backup?'))return;const ok=c=>c&&typeof c.name=='string'&&CATS.includes(c.cat)&&['kcal','protein','carbs','fat','sat','fiber','max'].every(k=>Number.isFinite(+c[k]));sv('profiles',d.profiles);sv('log',d.log||{});sv('foods',(d.foods||[]).filter(ok));sv('plan',Array.isArray(d.plan)?d.plan:[]);sv('fav',Array.isArray(d.fav)?d.fav:[]);sv('grochk',d.chk||{});location.reload()}catch(x){alert('That file is not a valid backup.')}};rd.readAsText(f)};
 $('bw').onclick=()=>{if(confirm('Delete ALL profiles, logs, plans and foods on this device? This cannot be undone.')){['profiles','log','foods','plan','fav','grochk'].forEach(k=>{try{localStorage.removeItem(k)}catch(e){}});location.reload()}}}
